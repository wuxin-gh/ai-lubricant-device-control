# Project-wide Gradle settings for the device-control Android build.

# AGP needs the JVM heap; 4g matches the reuse source (ARC-MCP) so the vendored
# Kotlin compiles under the same conditions it was written for.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

org.gradle.caching=true
org.gradle.parallel=true

# Required by AGP. core/ pulls in no androidx artifact today (the vendored
# accessibility/screencapture sources import only android.*), but AGP still
# expects this flag set, and app/ (M2) will need it.
android.useAndroidX=true

kotlin.code.style=official
